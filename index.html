    var banModal      = document.getElementById('banModal');

    /* ========================================================
     *  三、多语言字典
     * ======================================================== */
    var i18n = window.I18N;
    var currentLang = 'zh';

    /* ========================================================
     *  四、工具函数
     * ======================================================== */
    var EMAIL_RE = /^[\w.+-]+@[\w-]+(\.[\w-]+)+$/;
    var PHONE_RE = /^[\d\s\-+()]{6,20}$/;
    var ALLOWED_DOMAINS = [
        '@163.com', '@qq.com', '@sina.com', '@hotmail.com',
        '@sina.cn', '@live.cn', '@gmail.com', '@sohu.com'
    ];
    var PWD_RE = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

    function isValidEmail(email) {
        if (!EMAIL_RE.test(email)) return false;
        var lowerEmail = email.toLowerCase();
        return ALLOWED_DOMAINS.some(function (d) {
            return lowerEmail.endsWith(d);
        });
    }

    function fileNameFromPath(path) {
        var parts = String(path).split('/');
        var name  = parts[parts.length - 1];
        return name.replace(/\.[^.]+$/, '');
    }

    /* ⭐ 把 Supabase 的英文错误翻译成中文 */
    function translateAuthError(msg) {
        if (!msg) return '未知错误';
        var m = String(msg).toLowerCase();

        /* 登录相关 */
        if (m.indexOf('invalid login credentials') !== -1)  return '邮箱或密码错误';
        if (m.indexOf('email not confirmed') !== -1)        return '邮箱未验证，请先到邮箱点击确认链接';
        if (m.indexOf('user is banned') !== -1)             return '该账号已被封禁';
        if (m.indexOf('user_banned') !== -1)                return '该账号已被封禁';
        if (m.indexOf('email rate limit exceeded') !== -1)  return '操作过于频繁，请稍后再试';
        if (m.indexOf('for security purposes') !== -1)      return '出于安全考虑，请稍后再试';

        /* 注册相关 */
        if (m.indexOf('user already registered') !== -1)    return '该邮箱已被注册，请直接登录';
        if (m.indexOf('password should be at least') !== -1) {
            var match = msg.match(/at least (\d+)/);
            return match ? '密码长度至少 ' + match[1] + ' 位' : '密码太短';
        }
        if (m.indexOf('unable to validate email address') !== -1) return '邮箱格式不正确';
        if (m.indexOf('signups not allowed') !== -1)        return '当前不允许注册';
        if (m.indexOf('signup is disabled') !== -1)         return '注册功能已关闭';
        if (m.indexOf('email address not authorized') !== -1) return '该邮箱不被允许注册';
        if (m.indexOf('user not found') !== -1)             return '该用户不存在';

        /* 网络 */
        if (m.indexOf('failed to fetch') !== -1)            return '网络错误，请检查网络连接';
        if (m.indexOf('network') !== -1)                    return '网络错误，请稍后再试';
        if (m.indexOf('timeout') !== -1)                    return '请求超时，请稍后再试';

        /* 未知错误，返回原文 */
        return msg;
    }

    /* ⭐ 显示封禁弹窗 */
    function showBanModal(email, bannedUntil) {
        banModal.style.display = 'flex';
        banUntilDate.textContent = '查询中...';
        banRemaining.textContent = '查询中...';

        /* 如果已经有 bannedUntil，直接用 */
        if (bannedUntil) {
            renderBanTime(bannedUntil);
            return;
        }

        /* 否则调 Edge Function 查 */
        supabaseClient.functions.invoke('dynamic-handler', {
            body: { action: 'get_ban_info', email: email }
        }).then(function (res) {
            if (res.error || !res.data || !res.data.success) {
                banUntilDate.textContent = '请联系管理员';
                banRemaining.textContent = '—';
                return;
            }
            var data = res.data;
            if (data.banned_until) {
                renderBanTime(data.banned_until);
            } else {
                banUntilDate.textContent = '永久封禁';
                banRemaining.textContent = '—';
            }
        }).catch(function () {
            banUntilDate.textContent = '查询失败';
            banRemaining.textContent = '请联系管理员';
        });
    }

    function renderBanTime(bannedUntil) {
        var until = new Date(bannedUntil);
        banUntilDate.textContent = until.toLocaleString('zh-CN', { hour12: false });

        var diff = until.getTime() - Date.now();
        if (diff <= 0) {
            banRemaining.textContent = '即将解封';
            return;
        }
        var totalMin = Math.floor(diff / 60000);
        var days  = Math.floor(totalMin / 1440);
        var hours = Math.floor((totalMin % 1440) / 60);
        var mins  = totalMin % 60;
        var parts = [];
        if (days > 0)  parts.push(days + ' 天');
        if (hours > 0) parts.push(hours + ' 小时');
        if (days === 0 && mins > 0) parts.push(mins + ' 分钟');
        banRemaining.textContent = parts.join(' ') || '不到 1 分钟';
    }

    /* 关闭封禁弹窗 */
    function closeBanModal() {
        banModal.style.display = 'none';
    }
    banCloseBtn.addEventListener('click', closeBanModal);
    banModal.addEventListener('click', function (e) {
        if (e.target === banModal) closeBanModal();
    });

    var tipTimer = null;

        var dict = i18n[currentLang] || i18n.zh;
        var msg = dict[key] || key;
        tipEl.textContent = msg;
        tipEl.style.color = ok ? 'rgba(130,225,160,0.95)' : 'rgba(248,108,76,0.95)';
        tipEl.classList.add('show');
        clearTimeout(tipTimer);
        tipTimer = setTimeout(function () { tipEl.classList.remove('show'); }, 3000);
    }

    function showTipMsg(msg, ok) {
        tipEl.textContent = msg;
        tipEl.style.color = ok ? 'rgba(130,225,160,0.95)' : 'rgba(248,108,76,0.95)';
        tipEl.classList.add('show');
        clearTimeout(tipTimer);
        tipTimer = setTimeout(function () { tipEl.classList.remove('show'); }, 3000);

    var forgotTipTimer = null;

        var dict = i18n[currentLang] || i18n.zh;
        var msg = dict[key] || key;
        forgotTip.textContent = msg;
        forgotTip.style.color = ok ? 'rgba(130,225,160,0.95)' : 'rgba(248,108,76,0.95)';
        forgotTip.classList.add('show');
        clearTimeout(forgotTipTimer);
        forgotTipTimer = setTimeout(function () { forgotTip.classList.remove('show'); }, 2500);

    function clearRegisterForm() {
        regEmail.value  = '';
        regName.value   = '';
        regPhone.value  = '';
        regPwd.value    = '';
        regPwd2.value   = '';
    }

    /* ========================================================
     *  五、视图切换 & 语言应用
     * ======================================================== */
    function applyLanguage(lang) {
        var dict = i18n[lang];
        if (!dict) return;
        currentLang = lang;

        langBtn.textContent = '🌐 ' + dict.langBtn;
        bgBtn.textContent   = (BG_BTN_LABELS[lang] || BG_BTN_LABELS.zh);

            titleEl.textContent = dict.loginTitle;
        } else {
            titleEl.textContent = dict.registerTitle;
        }

        document.querySelector('#loginView .input-box:nth-child(1) label').textContent = dict.emailLabel;
        loginEmail.placeholder = dict.emailPlaceholder;
        document.querySelector('#loginView .input-box:nth-child(2) label').textContent = dict.pwdLabel;
        loginPwd.placeholder = dict.pwdPlaceholder;
        forgotLink.textContent = dict.forgotPwd;
        loginBtn.textContent = dict.loginBtn;
        toRegisterBtn.textContent = dict.registerBtn;

        document.querySelector('#registerView .input-box:nth-child(1) label').textContent = dict.emailLabel;
        regEmail.placeholder = dict.emailPlaceholder;
        document.querySelector('#registerView .input-box:nth-child(2) label').textContent = dict.nameLabel;
        regName.placeholder = dict.namePlaceholder;
        document.querySelector('#registerView .input-box:nth-child(3) label').textContent = dict.phoneLabel;
        regPhone.placeholder = dict.phonePlaceholder;
        document.querySelector('#registerView .input-box:nth-child(4) label').textContent = dict.pwdLabelReg;
        regPwd.placeholder = dict.pwdPlaceholderReg;
        document.querySelector('#registerView .input-box:nth-child(5) label').textContent = dict.confirmPwdLabel;
        regPwd2.placeholder = dict.confirmPwdPlaceholder;
        backLoginLink.textContent = dict.backLogin;
        registerBtn.textContent = dict.registerBtn;

        forgotTitle.textContent      = dict.forgotTitle;
        forgotEmailLabel.textContent = dict.forgotEmailLabel;
        forgotEmail.placeholder      = dict.forgotEmailPlaceholder;
        forgotContactLbl.textContent = dict.forgotContactLabel;
        forgotContact.placeholder    = dict.forgotContactPlaceholder;
        forgotReasonLbl.textContent  = dict.forgotReasonLabel;
        forgotReason.placeholder     = dict.forgotReasonPlaceholder;
        forgotSubmitBtn.textContent  = dict.forgotSubmit;
        forgotCancelBtn.textContent  = dict.forgotCancel;

        refreshBgCategoryLabels();
    }

    function showLoginView() {
        titleEl.textContent = i18n[currentLang].loginTitle;
        loginView.style.display = '';
        registerView.style.display = 'none';
        tipEl.classList.remove('show');
        clearRegisterForm();

        titleEl.textContent = i18n[currentLang].registerTitle;
        loginView.style.display = 'none';
        registerView.style.display = '';
        tipEl.classList.remove('show');
        regEmail.focus();

    backLoginLink.addEventListener('click', function (e) {
        e.preventDefault();
        showLoginView();

    /* ========================================================
     *  六、邮箱失焦检测
     * ======================================================== */
    loginEmail.addEventListener('blur', function () {
        var email = this.value.trim();
        if (email && !isValidEmail(email)) showTip('tipEmailFormat', false);
    });
    regEmail.addEventListener('blur', function () {
        var email = this.value.trim();
        if (email && !isValidEmail(email)) showTip('tipEmailFormat', false);
    });

    /* ========================================================
     *  七、登录逻辑
     * ======================================================== */
    function doLogin() {
        var email = loginEmail.value.trim();
        var pwd   = loginPwd.value;

        if (!isValidEmail(email)) {
            showTip('tipEmailFormat', false); loginEmail.focus(); return;
        }
        if (!pwd) {
            showTipMsg('请输入密码', false); loginPwd.focus(); return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = '登录中...';

        var currentUser = null;

        supabaseClient.auth.signInWithPassword({
            email: email,
            password: pwd
        }).then(function (res) {
            if (res.error) {
                var errMsg = (res.error.message || '').toLowerCase();

                /* ⭐ 如果是账号被封禁 */
                if (errMsg.indexOf('banned') !== -1) {
                    showBanModal(email);
                    var be = new Error('__BANNED__');
                    be.__isBanned = true;
                    throw be;
                }

                /* 普通错误 */
                var e = new Error(res.error.message);
                e.__translated = false;
                throw e;
            }

            currentUser = res.data.user;

            return supabaseClient
                .from('profiles')
                .select('is_blocked, banned_until')
                .eq('id', currentUser.id)
                .maybeSingle();
        }).then(function (profileRes) {
            if (profileRes.error) {
                console.warn('查询拉黑状态失败：', profileRes.error.message);
            }

            /* ⭐ 二次检查 profiles 表的封禁状态 */
            if (profileRes.data && profileRes.data.is_blocked === true) {
                showBanModal(email, profileRes.data.banned_until);
                return supabaseClient.auth.signOut().then(function () {
                    var be = new Error('__BANNED__');
                    be.__isBanned = true;
                    throw be;
                });
            }

            loginBtn.disabled = false;
            loginBtn.textContent = i18n[currentLang].loginBtn;
            showTip('tipLoginSuccess', true);
            console.log('[登录成功]', currentUser);
            clearRegisterForm();

            var role = currentUser.app_metadata && currentUser.app_metadata.role;

            setTimeout(function () {
                if (role === 'admin') {
                    location.href = 'admin-dashboard.html';
                } else {
                    location.href = 'user-dashboard.html';
                }
            }, 800);
        }).catch(function (err) {
            loginBtn.disabled = false;
            loginBtn.textContent = i18n[currentLang].loginBtn;

            /* 封禁弹窗已经显示，不显示普通错误 */
            if (err && err.__isBanned) return;

            var raw = (err && err.message) ? err.message : String(err);
            var msg = (err && err.__translated) ? raw : translateAuthError(raw);
            showTipMsg('登录失败：' + msg, false);
        });
    }

    /* ⭐ 修复：只绑定一次，先解锁音效再登录 */
    loginBtn.addEventListener('click', function () {
        if (window.LoginSound && window.LoginSound.unlock) {
            window.LoginSound.unlock();
        }
        doLogin();
    });

    /* ========================================================
     *  八、注册逻辑
     * ======================================================== */
    function doRegister() {
        var email = regEmail.value.trim();
        var name  = regName.value.trim();
        var phone = regPhone.value.trim();
        var pwd   = regPwd.value;
        var pwd2  = regPwd2.value;

        if (!isValidEmail(email)) {
            showTip('tipEmailFormat', false); regEmail.focus(); return;
        }
        if (name.length < 2) {
            showTip('tipNameLength', false); regName.focus(); return;
        }
        if (!PHONE_RE.test(phone)) {
            showTip('tipPhoneFormat', false); regPhone.focus(); return;
        }
        if (!PWD_RE.test(pwd)) {
            showTip('tipPwdLength', false); regPwd.focus(); return;
        }
        if (pwd !== pwd2) {
            showTip('tipPwdMatch', false); regPwd2.focus(); return;
        }

        registerBtn.disabled = true;
        registerBtn.textContent = '注册中...';

        var newUserId = null;

        supabaseClient.auth.signUp({
            email: email,
            password: pwd,
            options: {
                data: {
                    full_name: name,
                    phone: phone
                }
            }
        }).then(function (res) {
            if (res.error) {
                var e = new Error(res.error.message);
                e.__translated = false;
                throw e;
            }
            if (!res.data || !res.data.user) throw new Error('注册失败，请重试');
            newUserId = res.data.user.id;
            return res.data.session;
        }).then(function (session) {
            return supabaseClient
                .from('profiles')
                .insert([{
                    id: newUserId,
                    email: email,
                    full_name: name,
                    phone: phone
                }])
                .then(function (res2) {
                    return { session: session, profileRes: res2 };
                });
        }).then(function (result) {
            registerBtn.disabled = false;
            registerBtn.textContent = i18n[currentLang].registerBtn;

            if (result.profileRes && result.profileRes.error) {
                console.warn('profiles 写入失败：', result.profileRes.error.message);
            }

            if (result.session) {
                showTip('tipLoginSuccess', true);
            } else {
                showTip('tipRegConfirm', true);
            }

            loginEmail.value = email;
            loginPwd.value   = '';

            clearRegisterForm();
            setTimeout(showLoginView, 1800);
        }).catch(function (err) {
            registerBtn.disabled = false;
            registerBtn.textContent = i18n[currentLang].registerBtn;

            var raw = (err && err.message) ? err.message : String(err);
            var msg = (err && err.__translated) ? raw : translateAuthError(raw);
            showTipMsg('注册失败：' + msg, false);
        });
    }
    registerBtn.addEventListener('click', doRegister);
    regEmail.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') regName.focus();
    });
    regName.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') regPhone.focus();
    });
    regPhone.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') regPwd.focus();
    });
    regPwd.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') regPwd2.focus();
    });
    regPwd2.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doRegister();
    });

    /* ========================================================
     *  九、忘记密码弹窗
     * ======================================================== */
    function openForgotModal() {
        forgotModal.style.display = 'flex';
        forgotEmail.value   = '';
        forgotContact.value = '';
        forgotReason.value  = '';
        forgotTip.classList.remove('show');
        setTimeout(function () { forgotEmail.focus(); }, 50);
    }
    function closeForgotModal() {
        forgotModal.style.display = 'none';
    }
    forgotLink.addEventListener('click', function (e) {
        e.preventDefault(); openForgotModal();
    });
    forgotCancelBtn.addEventListener('click', closeForgotModal);
    forgotModal.addEventListener('click', function (e) {
        if (e.target === forgotModal) closeForgotModal();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            if (forgotModal.style.display !== 'none') closeForgotModal();
            if (banModal.style.display !== 'none') closeBanModal();
        }
    });

    function submitForgotForm() {
        var email   = forgotEmail.value.trim();
        var contact = forgotContact.value.trim();
        var reason  = forgotReason.value.trim();

        if (!isValidEmail(email)) {
            showForgotTip('tipForgotEmail', false); forgotEmail.focus(); return;
        }
        if (!contact) {
            showForgotTip('tipForgotContact', false); forgotContact.focus(); return;
        }

        forgotSubmitBtn.disabled = true;
        forgotSubmitBtn.textContent = '提交中...';

        supabaseClient
            .from('forgot_requests')
            .insert([{ email: email, contact: contact, reason: reason }])
            .then(function (res) {
                forgotSubmitBtn.disabled = false;
                forgotSubmitBtn.textContent = i18n[currentLang].forgotSubmit;

                if (res.error) {
                    showForgotTip('提交失败：' + res.error.message, false);
                    return;
                }
                showForgotTip('tipForgotSent', true);
                setTimeout(closeForgotModal, 1500);
            }).catch(function (err) {
                forgotSubmitBtn.disabled = false;
                forgotSubmitBtn.textContent = i18n[currentLang].forgotSubmit;
                showForgotTip('提交失败：' + (err && err.message ? err.message : err), false);
            });
    }
    forgotSubmitBtn.addEventListener('click', submitForgotForm);
    forgotEmail.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') forgotContact.focus();
    });
    forgotContact.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') forgotReason.focus();
    });

    /* ========================================================
     *  十、语言切换
     * ======================================================== */
    langBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        var willShow = !langDropdown.classList.contains('show');
        bgDropdown.classList.remove('show');
        langDropdown.classList.toggle('show', willShow);
    });
    langDropdown.addEventListener('click', function (e) {
        e.stopPropagation();
    });
    document.querySelectorAll('#langDropdown a').forEach(function (link) {
        link.addEventListener('click', function (e) {
            e.preventDefault();
            applyLanguage(this.getAttribute('data-lang'));
            langDropdown.classList.remove('show');
        });
    });

    /* ========================================================
     *  十一、背景切换
     * ======================================================== */
    var BACKGROUND_CONFIG = window.BACKGROUND_CONFIG || {};

    function buildBgMenu() {
        bgDropdown.innerHTML = '';

        CATEGORY_ORDER.forEach(function (catKey) {
            var items = BACKGROUND_CONFIG[catKey] || [];
            if (items.length === 0) return;

            var catEl = document.createElement('div');
            catEl.className = 'bg-category';
            catEl.dataset.cat = catKey;

            var titleA = document.createElement('a');
            titleA.href = '#';
            titleA.className = 'bg-cat-title';
            titleA.textContent = (CATEGORY_LABELS_I18N[currentLang] || CATEGORY_LABELS_I18N.zh)[catKey];

            titleA.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                var wasActive = catEl.classList.contains('active');
                bgDropdown.querySelectorAll('.bg-category').forEach(function (el) {
                    el.classList.remove('active');
                });
                if (!wasActive) catEl.classList.add('active');
            });

            var itemsEl = document.createElement('div');
            itemsEl.className = 'bg-items';

            items.forEach(function (path) {
                var itemA = document.createElement('a');
                itemA.href = '#';
                itemA.textContent = fileNameFromPath(path);

                itemA.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    setBackground(catKey, path);
                    bgDropdown.classList.remove('show');
                    bgDropdown.querySelectorAll('.bg-category').forEach(function (el) {
                        el.classList.remove('active');
                    });
                });
                itemsEl.appendChild(itemA);
            });

            catEl.appendChild(titleA);
            catEl.appendChild(itemsEl);
            bgDropdown.appendChild(catEl);
        });
    }

    function refreshBgCategoryLabels() {
        var labels = CATEGORY_LABELS_I18N[currentLang] || CATEGORY_LABELS_I18N.zh;
        bgDropdown.querySelectorAll('.bg-category').forEach(function (catEl) {
            var t = catEl.querySelector('.bg-cat-title');
            if (t) t.textContent = labels[catEl.dataset.cat];
        });
    }

    function setBackground(type, src) {
        if (type === 'image') {
            bgImage.style.backgroundImage = 'url("' + src + '")';
            bgImage.style.opacity = '1';
            bgVideo.style.opacity = '0';
            setTimeout(function () {
                if (bgImage.style.opacity === '1') {
                    try { bgVideo.pause(); } catch (err) {}
                }
            }, 1200);
        } else {
            try {
                bgVideo.src = src;
                bgVideo.load();
                bgVideo.play().catch(function () {});
            } catch (err) { console.warn('视频加载失败：', err); }
            bgVideo.style.opacity = '1';
            bgImage.style.opacity = '0';
        }
        console.log('[背景] 切换到：', type, '→', src);
    }

    var defaultBg = (BACKGROUND_CONFIG.image && BACKGROUND_CONFIG.image[0]) || 'image/bg.jpg';
    bgImage.style.backgroundImage = 'url("' + defaultBg + '")';
    bgImage.style.opacity = '1';

    bgBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        var willShow = !bgDropdown.classList.contains('show');
        langDropdown.classList.remove('show');
        if (willShow) {
            bgDropdown.querySelectorAll('.bg-category').forEach(function (el) {
                el.classList.remove('active');
            });
        }
        bgDropdown.classList.toggle('show', willShow);
    });
    bgDropdown.addEventListener('click', function (e) {
        e.stopPropagation();
    });
    document.addEventListener('click', function () {
        langDropdown.classList.remove('show');
        bgDropdown.classList.remove('show');
    });

    /* ========================================================
     *  十二、初始化
     * ======================================================== */
    buildBgMenu();
    applyLanguage('zh');
    showLoginView();

</script>
