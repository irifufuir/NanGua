    /* ★ i18n 快捷取值：支持 "common.cancel" 这种深路径 */
    function t(key, fallback) {
        var dict = (i18n && i18n[currentLang]) || (i18n && i18n.zh) || {};

        var cur = dict;
        for (var i = 0; i < parts.length; i++) {
            if (cur == null || typeof cur !== 'object') { cur = null; break; }
            cur = cur[parts[i]];
        }
        return (cur != null) ? cur : (fallback != null ? fallback : key);
    }

    var EMAIL_RE = /^[\w.+-]+@[\w-]+(\.[\w-]+)+$/;
    var PHONE_RE = /^[\d\s\-+()]{6,20}$/;
    var ALLOWED_DOMAINS = [
        '@qq.com', '@foxmail.com', '@vip.qq.com',

    ];
    var PWD_RE = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

    function isValidEmail(email) {
        if (!EMAIL_RE.test(email)) return false;
        var lowerEmail = email.toLowerCase();
        return ALLOWED_DOMAINS.some(function (d) {
            return lowerEmail.endsWith(d);
        });
    }

    var __emailExistsCache = {};
    var __EMAIL_CACHE_TTL = 5000;

    function checkEmailExists(email) {
        if (!email) return Promise.resolve(null);
        var key = String(email).trim().toLowerCase();
        var now = Date.now();

        var cached = __emailExistsCache[key];
        if (cached && (now - cached.t) < __EMAIL_CACHE_TTL) {
            return Promise.resolve(cached.v);
        }

        return supabaseClient
            .rpc('check_email_exists', { p_email: key })
            .then(function (res) {
                if (res.error) {
                    console.warn('[checkEmailExists] RPC 失败：', res.error.message);
                    return null;
                }
                var exists = (res.data === true);
                __emailExistsCache[key] = { v: exists, t: now };
                return exists;
            })
            .catch(function (e) {
                console.warn('[checkEmailExists] 异常：', e);
                return null;
            });
    }

    function clearEmailCache() {
        __emailExistsCache = {};
    }

    function fileNameFromPath(path) {
        var parts = String(path).split('/');
        var name  = parts[parts.length - 1];
        return name.replace(/\.[^.]+$/, '');
    }

    function translateAuthError(msg) {
        if (!msg) return t('errUnknown');
        var m = String(msg).toLowerCase();

        if (m.indexOf('invalid login credentials') !== -1)  return t('errInvalidCredentials');
        if (m.indexOf('email not confirmed') !== -1)        return t('errEmailNotConfirmed');
        if (m.indexOf('user is banned') !== -1)             return t('errUserBanned');
        if (m.indexOf('user_banned') !== -1)                return t('errUserBanned');
        if (m.indexOf('email rate limit exceeded') !== -1)  return t('errRateLimit');
        if (m.indexOf('for security purposes') !== -1)      return t('errSecurity');

        if (m.indexOf('user already registered') !== -1)    return t('errAlreadyRegistered');
        if (m.indexOf('password should be at least') !== -1) {
            var match = msg.match(/at least (\d+)/);
            if (match) {
                return t('errPwdAtLeastPrefix') + match[1] + t('errPwdAtLeastSuffix');
            }
            return t('errPwdTooShort');
        }
        if (m.indexOf('unable to validate email address') !== -1) return t('errEmailInvalid');
        if (m.indexOf('signups not allowed') !== -1)        return t('errSignupsNotAllowed');
        if (m.indexOf('signup is disabled') !== -1)         return t('errSignupDisabled');
        if (m.indexOf('email address not authorized') !== -1) return t('errEmailNotAuthorized');
        if (m.indexOf('user not found') !== -1)             return t('errUserNotFound');

        if (m.indexOf('failed to fetch') !== -1)            return t('errNetwork');
        if (m.indexOf('network') !== -1)                    return t('errNetworkRetry');
        if (m.indexOf('timeout') !== -1)                    return t('errTimeout');

        return msg;
    }

    /* ★ 让封禁弹窗的静态文字跟着语言变 */
    function refreshBanModalLabels() {

    function showBanModal(email, bannedUntil) {
        refreshBanModalLabels();   /* ★ 弹窗前刷新静态文案 */
        banModal.style.display = 'flex';
        banUntilDate.textContent = t('banQuerying');
        banRemaining.textContent = t('banQuerying');

        if (bannedUntil) {
            renderBanTime(bannedUntil);
            return;
        }

        supabaseClient.functions.invoke('dynamic-handler', {
            body: { action: 'get_ban_info', email: email }
        }).then(function (res) {
            if (res.error || !res.data || !res.data.success) {
                banUntilDate.textContent = t('banContactAdmin');
                banRemaining.textContent = '—';
                return;
            }
            var data = res.data;
            if (data.banned_until) {
                renderBanTime(data.banned_until);
            } else {
                banUntilDate.textContent = t('banPermanent');
                banRemaining.textContent = '—';
            }
        }).catch(function () {
            banUntilDate.textContent = t('banQueryFailed');
            banRemaining.textContent = t('banContactAdmin');
        });
    }

    function renderBanTime(bannedUntil) {
        var until = new Date(bannedUntil);
        banUntilDate.textContent = until.toLocaleString('zh-CN', { hour12: false });

        var diff = until.getTime() - Date.now();
        if (diff <= 0) {
            banRemaining.textContent = t('banUnlockingSoon');
            return;
        }
        var totalMin = Math.floor(diff / 60000);
        var days  = Math.floor(totalMin / 1440);
        var hours = Math.floor((totalMin % 1440) / 60);
        var mins  = totalMin % 60;
        var parts = [];
        if (days > 0)  parts.push(days + t('banDaysUnit'));
        if (hours > 0) parts.push(hours + t('banHoursUnit'));
        if (days === 0 && mins > 0) parts.push(mins + t('banMinutesUnit'));
        banRemaining.textContent = parts.join(' ') || t('banLessThanMinute');
    }

        e.preventDefault();
        showLoginView();
    });

    function bindBoxToggle() {
        if (!boxToggle || !boxEl) return;
        boxToggle.addEventListener('click', function (e) {
            e.stopPropagation();
            if (boxEl.classList.contains('collapsed')) {
                expandBox();
            } else {
                collapseBox();
            }
        });
    }

    function playBoxOpen() {
        if (!boxEl) return;
        boxEl.classList.remove('is-closing');
        boxEl.classList.add('is-opening');
        boxEl.addEventListener('animationend', function onOpenEnd(e) {
            if (e.animationName !== 'cardOpen') return;
            boxEl.classList.remove('is-opening');
            boxEl.removeEventListener('animationend', onOpenEnd);
        });
    }

    function collapseBox() {
        if (!boxEl || boxEl.classList.contains('collapsed')) return;
        boxEl.classList.remove('is-opening');
        boxEl.classList.add('collapsed');
        setTimeout(function () {
            if (boxEl.classList.contains('collapsed')) {
                boxToggle.textContent = '+';
                boxToggle.title = t('boxExpand', '展开');
            }
        }, 220);
    }

    function expandBox() {
        if (!boxEl || !boxEl.classList.contains('collapsed')) return;
        boxToggle.textContent = '−';
        boxToggle.title = t('boxCollapse', '收起 / 展开');
        boxEl.classList.remove('collapsed');
    }

    loginEmail.addEventListener('blur', function () {
        var email = this.value.trim();
        if (!email) return;

        if (!isValidEmail(email)) {
            showTipMsg(t('tipEmailInvalid'), false);
            return;
        }
        showTipMsg(t('tipEmailOk'), true);

        loginTipEl.textContent = t('tipChecking');
        loginTipEl.style.color = 'rgba(255,255,255,0.55)';
        loginTipEl.classList.add('show');
        clearTimeout(loginTipTimer);

        checkEmailExists(email).then(function (exists) {
            if (exists === false) {
                showTipMsg(t('tipEmailNotRegistered'), false);
            } else if (exists === true) {
                showTipMsg(t('tipEmailSuffixOk'), true);
            } else {
                loginTipEl.classList.remove('show');
            }
        });
    });

    function updateRegEmailSuffixTag() {
        var email = regEmail.value.trim();

        if (!email || email.indexOf('@') === -1) {
            regEmailSuffixTag.classList.remove('show', 'ok', 'bad');
            regEmailSuffixTag.textContent = '';
            return;
        }

        var ok = isValidEmail(email);
        regEmailSuffixTag.textContent = ok ? t('tipEmailSuffixUsable') : t('tipEmailSuffixUnusable');
        regEmailSuffixTag.classList.toggle('ok',  ok);
        regEmailSuffixTag.classList.toggle('bad', !ok);
        regEmailSuffixTag.classList.add('show');
    }

    function hideRegExistsTag() { regExistsTag.classList.remove('show'); }
    function showRegExistsTag() { regExistsTag.classList.add('show'); }

    var regCheckTimer = null;

    function scheduleRegExistsCheck() {
        hideRegExistsTag();
        clearTimeout(regCheckTimer);

        var email = regEmail.value.trim();
        if (!email) return;
        if (!isValidEmail(email)) return;

        regCheckTimer = setTimeout(function () {
            checkEmailExists(email).then(function (exists) {
                if (regEmail.value.trim() !== email) return;
                if (exists === true) showRegExistsTag();
                else                 hideRegExistsTag();
            });
        }, 300);
    }

    regEmail.addEventListener('input', updateRegEmailSuffixTag);
    regEmail.addEventListener('input', scheduleRegExistsCheck);
    regEmail.addEventListener('blur',  scheduleRegExistsCheck);

    function doLogin() {
        var email = loginEmail.value.trim();
        var pwd   = loginPwd.value;

        if (!isValidEmail(email)) {
            showTipMsg(t('tipEmailInvalid'), false);
            loginEmail.focus();
            return;
        }
        if (!pwd) {
            showTipMsg(t('tipPwdRequired'), false); loginPwd.focus(); return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = t('btnChecking');

        checkEmailExists(email).then(function (exists) {
            loginBtn.disabled = false;
            loginBtn.textContent = i18n[currentLang].loginBtn;

            if (exists === false) {
                showTipMsg(t('tipEmailNotRegistered'), false);
                loginEmail.focus();
                return;
            }
            actuallyLogin(email, pwd);
        });
    }

    function actuallyLogin(email, pwd) {
        loginBtn.disabled = true;
        loginBtn.textContent = t('btnLoggingIn');

        var currentUser = null;

        supabaseClient.auth.signInWithPassword({
            email: email,
            password: pwd
        }).then(function (res) {
            if (res.error) {
                var errMsg = (res.error.message || '').toLowerCase();

                if (errMsg.indexOf('banned') !== -1) {
                    showBanModal(email);
                    var be = new Error('__BANNED__');
                    be.__isBanned = true;
                    throw be;
                }

                var e = new Error(res.error.message);
                e.__translated = false;
                throw e;
            }

            currentUser = res.data.user;

            return supabaseClient
                .from('profiles')
                .select('is_blocked, banned_until')
                .eq('id', currentUser.id)
                .maybeSingle();
        }).then(function (profileRes) {
            if (profileRes.error) {
                console.warn('查询拉黑状态失败：', profileRes.error.message);
            }

            if (profileRes.data && profileRes.data.is_blocked === true) {
                showBanModal(email, profileRes.data.banned_until);
                return supabaseClient.auth.signOut().then(function () {
                    var be = new Error('__BANNED__');
                    be.__isBanned = true;
                    throw be;
                });
            }

            loginBtn.disabled = false;
            loginBtn.textContent = i18n[currentLang].loginBtn;
            clearEmailCache();
            showTip('tipLoginSuccess', true);
            console.log('[登录成功]', currentUser);
            clearRegisterForm();

            var role = currentUser.app_metadata && currentUser.app_metadata.role;

            setTimeout(function () {
                try { sessionStorage.setItem('nangua_fresh_login', '1'); } catch (e) {}

                var langQS = '';
                try {
                    var curLang = localStorage.getItem('nangua_lang');
                    if (curLang) langQS = '?lang=' + encodeURIComponent(curLang);
                } catch (e) {}

                if (role === 'admin') {
                    location.href = 'admin-dashboard.html' + langQS;
                } else {
                    location.href = 'user-dashboard.html' + langQS;
                }
            }, 800);
        }).catch(function (err) {
            loginBtn.disabled = false;
            loginBtn.textContent = i18n[currentLang].loginBtn;

            if (err && err.__isBanned) return;

            var raw = (err && err.message) ? err.message : String(err);
            var msg = (err && err.__translated) ? raw : translateAuthError(raw);
            showTipMsg(t('submitFailed') + msg, false);
        });
    }

    loginBtn.addEventListener('click', function () {
        if (window.LoginSound && window.LoginSound.unlock) {
            window.LoginSound.unlock();
        }
        doLogin();
    });

    function doRegister() {
        var email = regEmail.value.trim();
        var name  = regName.value.trim();
        var phone = regPhone.value.trim();
        var pwd   = regPwd.value;
        var pwd2  = regPwd2.value;

        if (!isValidEmail(email)) {
            showRegTipMsg(t('tipEmailInvalid'), false);
            regEmail.focus();
            return;
        }
        if (name.length < 2) {
            showRegTip('tipNameLength', false); regName.focus(); return;
        }
        if (!PHONE_RE.test(phone)) {
            showRegTip('tipPhoneFormat', false); regPhone.focus(); return;
        }
        if (!PWD_RE.test(pwd)) {
            showRegTip('tipPwdLength', false); regPwd.focus(); return;
        }
        if (pwd !== pwd2) {
            showRegTip('tipPwdMatch', false); regPwd2.focus(); return;
        }

        registerBtn.disabled = true;
        registerBtn.textContent = t('btnChecking');

        checkEmailExists(email).then(function (exists) {
            if (exists === true) {
                registerBtn.disabled = false;
                registerBtn.textContent = i18n[currentLang].registerBtn;
                showRegExistsTag();
                regEmail.focus();
                return;
            }
            actuallyRegister(email, name, phone, pwd);
        });
    }

    function actuallyRegister(email, name, phone, pwd) {
        registerBtn.disabled = true;
        registerBtn.textContent = t('btnRegistering');

        var newUserId = null;

        supabaseClient.auth.signUp({
            email: email,
            password: pwd,
            options: {
                data: {
                    full_name: name,
                    phone: phone
                }
            }
        }).then(function (res) {
            if (res.error) {
                var e = new Error(res.error.message);
                e.__translated = false;
                throw e;
            }
            if (!res.data || !res.data.user) throw new Error(t('registerFailedRetry'));
            newUserId = res.data.user.id;
            return res.data.session;
        }).then(function (session) {
            return supabaseClient
                .from('profiles')
                .insert([{
                    id: newUserId,
                    email: email.toLowerCase(),
                    full_name: name,
                    phone: phone
                }])
                .then(function (res2) {
                    return { session: session, profileRes: res2 };
                });
        }).then(function (result) {
            registerBtn.disabled = false;
            registerBtn.textContent = i18n[currentLang].registerBtn;

            if (result.profileRes && result.profileRes.error) {
                console.warn('profiles 写入失败：', result.profileRes.error.message);
            }

            clearEmailCache();

            if (result.session) {
                showRegTip('tipLoginSuccess', true);
            } else {
                showRegTip('tipRegConfirm', true);
            }

            loginEmail.value = email;
            loginPwd.value   = '';

            clearRegisterForm();
            setTimeout(showLoginView, 1800);
        }).catch(function (err) {
            registerBtn.disabled = false;
            registerBtn.textContent = i18n[currentLang].registerBtn;

            var raw = (err && err.message) ? err.message : String(err);
            var msg = (err && err.__translated) ? raw : translateAuthError(raw);
            showRegTipMsg(t('submitFailed') + msg, false);
        });
    }
    registerBtn.addEventListener('click', doRegister);
    regEmail.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') regName.focus();
    });
    regName.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') regPhone.focus();
    });
    regPhone.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') regPwd.focus();
    });
    regPwd.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') regPwd2.focus();
    });
    regPwd2.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doRegister();
    });

    function openForgotModal() {
        forgotModal.style.display = 'flex';
        forgotEmail.value   = '';
        forgotContact.value = '';
        forgotReason.value  = '';
        forgotTip.classList.remove('show');
        setTimeout(function () { forgotEmail.focus(); }, 50);
    }
    function closeForgotModal() {
        forgotModal.style.display = 'none';
    }
    forgotLink.addEventListener('click', function (e) {
        e.preventDefault(); openForgotModal();
    });
    forgotCancelBtn.addEventListener('click', closeForgotModal);
    forgotModal.addEventListener('click', function (e) {
        if (e.target === forgotModal) closeForgotModal();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            if (forgotModal.style.display !== 'none') closeForgotModal();
            if (banModal.style.display !== 'none') closeBanModal();
        }
    });

    function submitForgotForm() {
        var email   = forgotEmail.value.trim();
        var contact = forgotContact.value.trim();
        var reason  = forgotReason.value.trim();

        if (!isValidEmail(email)) {
            showForgotTip('tipForgotEmail', false); forgotEmail.focus(); return;
        }
        if (!contact) {
            showForgotTip('tipForgotContact', false); forgotContact.focus(); return;
        }

        forgotSubmitBtn.disabled = true;
        forgotSubmitBtn.textContent = t('btnSubmitting');

        supabaseClient
            .from('forgot_requests')
            .insert([{ email: email, contact: contact, reason: reason }])
            .then(function (res) {
                forgotSubmitBtn.disabled = false;
                forgotSubmitBtn.textContent = i18n[currentLang].forgotSubmit;

                if (res.error) {
                    showForgotTip('提交失败：' + res.error.message, false);
                    return;
                }
                showForgotTip('tipForgotSent', true);
                setTimeout(closeForgotModal, 1500);
            }).catch(function (err) {
                forgotSubmitBtn.disabled = false;
                forgotSubmitBtn.textContent = i18n[currentLang].forgotSubmit;
                showForgotTip('提交失败：' + (err && err.message ? err.message : err), false);
            });
    }
    forgotSubmitBtn.addEventListener('click', submitForgotForm);
    forgotEmail.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') forgotContact.focus();
    });
    forgotContact.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') forgotReason.focus();
    });

    langBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        var willShow = !langDropdown.classList.contains('show');
        bgDropdown.classList.remove('show');
        langDropdown.classList.toggle('show', willShow);
    });
    langDropdown.addEventListener('click', function (e) {
        e.stopPropagation();
    });
    document.querySelectorAll('#langDropdown a').forEach(function (link) {
        link.addEventListener('click', function (e) {
            e.preventDefault();
            var code = this.getAttribute('data-lang');

            try { localStorage.setItem('nangua_lang', code); } catch (err) {}

            applyLanguage(code);
            langDropdown.classList.remove('show');
        });
    });

    var BACKGROUND_CONFIG = window.BACKGROUND_CONFIG || {};

    function buildBgMenu() {
        bgDropdown.innerHTML = '';

        CATEGORY_ORDER.forEach(function (catKey) {
            var items = BACKGROUND_CONFIG[catKey] || [];
            if (items.length === 0) return;

            var catEl = document.createElement('div');
            catEl.className = 'bg-category';
            catEl.dataset.cat = catKey;

            var titleA = document.createElement('a');
            titleA.href = '#';
            titleA.className = 'bg-cat-title';
            titleA.textContent = (CATEGORY_LABELS_I18N[currentLang] || CATEGORY_LABELS_I18N.zh)[catKey];

            titleA.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                var wasActive = catEl.classList.contains('active');
                bgDropdown.querySelectorAll('.bg-category').forEach(function (el) {
                    el.classList.remove('active');
                });
                if (!wasActive) catEl.classList.add('active');
            });

            var itemsEl = document.createElement('div');
            itemsEl.className = 'bg-items';

            items.forEach(function (path) {
                var itemA = document.createElement('a');
                itemA.href = '#';
                itemA.textContent = fileNameFromPath(path);

                itemA.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    setBackground(catKey, path);
                    bgDropdown.classList.remove('show');
                    bgDropdown.querySelectorAll('.bg-category').forEach(function (el) {
                        el.classList.remove('active');
                    });
                });
                itemsEl.appendChild(itemA);
            });

            catEl.appendChild(titleA);
            catEl.appendChild(itemsEl);
            bgDropdown.appendChild(catEl);
        });
    }

    function refreshBgCategoryLabels() {
        var labels = CATEGORY_LABELS_I18N[currentLang] || CATEGORY_LABELS_I18N.zh;
        bgDropdown.querySelectorAll('.bg-category').forEach(function (catEl) {
            var t2 = catEl.querySelector('.bg-cat-title');
            if (t2) t2.textContent = labels[catEl.dataset.cat];
        });
    }

    function setBackground(type, src) {
        if (type === 'image') {
            bgImage.style.backgroundImage = 'url("' + src + '")';
            bgImage.style.opacity = '1';
            bgVideo.style.opacity = '0';
            setTimeout(function () {
                if (bgImage.style.opacity === '1') {
                    try { bgVideo.pause(); } catch (err) {}
                }
            }, 1200);
        } else {
            try {
                bgVideo.src = src;
                bgVideo.load();
                bgVideo.play().catch(function () {});
            } catch (err) { console.warn('视频加载失败：', err); }
            bgVideo.style.opacity = '1';
            bgImage.style.opacity = '0';
        }
        console.log('[背景] 切换到：', type, '→', src);
    }

    var defaultBg = (BACKGROUND_CONFIG.image && BACKGROUND_CONFIG.image[0]) || 'image/bg.jpg';
    bgImage.style.backgroundImage = 'url("' + defaultBg + '")';
    bgImage.style.opacity = '1';

    bgBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        var willShow = !bgDropdown.classList.contains('show');
        langDropdown.classList.remove('show');
        if (willShow) {
            bgDropdown.querySelectorAll('.bg-category').forEach(function (el) {
                el.classList.remove('active');
            });
        }
        bgDropdown.classList.toggle('show', willShow);
    });
    bgDropdown.addEventListener('click', function (e) {
        e.stopPropagation();
    });
    document.addEventListener('click', function () {
        langDropdown.classList.remove('show');
        bgDropdown.classList.remove('show');
    });

    buildBgMenu();

    (function initLang() {
        var saved = null;
        try { saved = localStorage.getItem('nangua_lang'); } catch (e) {}
        var supported = ['zh','en','ja','ko','fr','es'];
        if (!saved || supported.indexOf(saved) === -1) saved = 'zh';
        applyLanguage(saved);
    })();

    showLoginView();
    bindBoxToggle();
    playBoxOpen();

    function getDeviceName() {
        var ua = navigator.userAgent || '';
        var platform = t('deviceUnknown', '未知设备');
        if (/Windows/i.test(ua))                  platform = 'Windows';
        else if (/Macintosh|Mac OS X/i.test(ua))  platform = 'Mac';
        else if (/Android/i.test(ua))             platform = 'Android';
        else if (/iPhone|iPad|iPod/i.test(ua))    platform = 'iOS';
        else if (/Linux/i.test(ua))               platform = 'Linux';

        var browser = t('deviceBrowser', '浏览器');
        if (/Edg\//i.test(ua))                    browser = 'Edge';
        else if (/OPR\/|Opera/i.test(ua))         browser = 'Opera';
        else if (/Chrome\//i.test(ua))            browser = 'Chrome';
        else if (/Firefox\//i.test(ua))           browser = 'Firefox';
        else if (/Safari\//i.test(ua))            browser = 'Safari';

        return platform + ' · ' + browser;
    }

    (function initDeviceHint() {
        var el = document.getElementById('deviceHintName');
        if (el) el.textContent = getDeviceName();
    })();

</script>
