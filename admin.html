<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a1a">
    <title>齿轮盛宴 · 管理登录</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

    <div class="bg-container">
        <div class="bg-image" id="bgImage"></div>
    </div>

    <div class="box admin-box">
        <h2 id="title">🔐 管理员登录</h2>

        <div class="input-box">
            <label>管理员邮箱</label>
            <input type="email" id="adminEmail"
                   placeholder="请输入管理员邮箱" autocomplete="off"/>
        </div>

        <div class="input-box">
            <label>密码</label>
            <input type="password" id="adminPwd"
                   placeholder="请输入密码" autocomplete="current-password"/>
        </div>

        <p class="tip" id="tip"></p>

        <div class="btn-box">
            <a href="index.html" class="back-link">← 返回普通登录</a>
            <div>
                <button type="button" id="adminLoginBtn" class="single-btn">
                    登录管理后台
                </button>
            </div>
        </div>
    </div>

<script type="text/javascript">

    var SUPABASE_URL = 'https://syxawclhvreyxltynpnj.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_EvEBa8dU22MpK6E7UsnWbQ_2JRdVeZQ';
    var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var adminEmail   = document.getElementById('adminEmail');
    var adminPwd     = document.getElementById('adminPwd');
    var adminLoginBtn= document.getElementById('adminLoginBtn');
    var tipEl        = document.getElementById('tip');
    var bgImage      = document.getElementById('bgImage');

    bgImage.style.backgroundImage = 'url("image/bg.jpg")';
    bgImage.style.opacity = '1';

    var tipTimer = null;
    function showTip(msg, ok) {
        tipEl.textContent = msg;
        tipEl.style.color = ok
            ? 'rgba(130, 225, 160, 0.95)'
            : 'rgba(248, 108, 76, 0.95)';
        tipEl.classList.add('show');
        clearTimeout(tipTimer);
        tipTimer = setTimeout(function () {
            tipEl.classList.remove('show');
        }, 3000);
    }

    var EMAIL_RE = /^[\w.+-]+@[\w-]+(\.[\w-]+)+$/;
    function isValidEmail(email) { return EMAIL_RE.test(email); }

    /* ============================================================
     * 唯一会触发跳转的地方：用户点击「登录管理后台」按钮
     * ============================================================ */
    function doAdminLogin() {
        var email = adminEmail.value.trim();
        var pwd   = adminPwd.value;

        if (!isValidEmail(email)) {
            showTip('请输入正确的管理员邮箱');
            adminEmail.focus();
            return;
        }
        if (pwd.length < 6) {
            showTip('密码长度至少 6 位');
            adminPwd.focus();
            return;
        }

        adminLoginBtn.disabled = true;
        adminLoginBtn.textContent = '登录中...';

        supabaseClient.auth.signInWithPassword({
            email: email,
            password: pwd
        }).then(function (res) {
            if (res.error) throw res.error;

            var user = res.data.user;
            var role = user.app_metadata && user.app_metadata.role;

            if (role !== 'admin') {
                return supabaseClient.auth.signOut().then(function () {
                    throw new Error('该账号不是管理员，无权访问');
                });
            }

            adminLoginBtn.disabled = false;
            adminLoginBtn.textContent = '登录管理后台';
            showTip('登录成功，正在进入管理后台...', true);

            // 清掉任何防止跳转的标记
            sessionStorage.removeItem('admin_redirect_guard');

            setTimeout(function () {
                location.href = 'admin-dashboard.html';
            }, 600);

        }).catch(function (err) {
            adminLoginBtn.disabled = false;
            adminLoginBtn.textContent = '登录管理后台';
            var msg = (err && err.message) ? err.message : String(err);
            showTip('登录失败：' + msg, false);
            adminPwd.value = '';
            adminPwd.focus();
        });
    }

    adminLoginBtn.addEventListener('click', doAdminLogin);

    adminEmail.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') adminPwd.focus();
    });
    adminPwd.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doAdminLogin();
    });

    /* ============================================================
     * 注意：本页没有任何「自动跳转」逻辑
     * 即使本地已经有 admin session，也停在登录页，
     * 必须用户手动点击「登录管理后台」并认证通过后才跳转。
     * ============================================================ */

</script>
</body>
</html>
