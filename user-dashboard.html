<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a1a">
    <title>齿轮盛宴 · 用户中心</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">

    <link rel="stylesheet" href="other/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                     "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, var(--theme-bg-start) 0%, var(--theme-bg-end) 100%);
        color: var(--theme-text);
        font-size: calc(14px * var(--ui-font-scale, 1));
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        -webkit-tap-highlight-color: transparent;
    }

    /* ============================================================
       侧边栏
       ============================================================ */
    .sidebar {
        width: 260px;
        background: var(--theme-sidebar);
        border-right: 1px solid var(--theme-border);
        display: flex;
        flex-direction: column;
        padding: 24px 0;
        flex-shrink: 0;
    }

    .user-profile {
        display: flex;
        align-items: center;
        padding: 0 20px 20px;
        border-bottom: 1px solid var(--theme-border);
        margin-bottom: 15px;
        gap: 12px;
    }
    .avatar-wrapper {
        position: relative;
        width: 48px;
        height: 48px;
        flex-shrink: 0;
    }
    .avatar-wrapper img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--theme-accent);
        background: var(--theme-accent-soft);
    }
    .avatar-edit {
        position: absolute;
        bottom: 0; right: 0;
        width: 18px; height: 18px;
        background: var(--theme-accent);
        color: #1a1a1a;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        cursor: pointer;
        transition: 0.2s;
    }
    .avatar-edit:hover { transform: scale(1.1); }

    .user-details {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1;
        gap: 6px;
    }
    .user-details .email {
        font-size: 1em;
        color: var(--theme-text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .user-bottom-row {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .user-details .role {
        font-size: 0.78em;
        color: var(--theme-accent);
        background: var(--theme-accent-soft);
        border: 1px solid var(--theme-accent-border);
        padding: 2px 8px;
        border-radius: 10px;
    }
    .logout-btn-mini {
        background: rgba(220, 60, 60, 0.4);
        border: 1px solid rgba(255, 100, 100, 0.6);
        color: #ffaaaa;
        font-size: 0.78em;
        padding: 3px 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
        white-space: nowrap;
    }
    .logout-btn-mini:hover {
        background: rgba(255, 80, 80, 0.7);
        color: #fff;
    }

    .nav-menu { flex: 1; overflow-y: auto; }
    .nav-item {
        padding: 14px 22px;
        color: var(--theme-text-dim);
        cursor: pointer;
        transition: 0.2s;
        border-left: 3px solid transparent;
        font-size: 1em;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .nav-item:hover { background: var(--theme-hover); color: var(--theme-text); }
    .nav-item.active {
        background: var(--theme-accent-soft);
        color: var(--theme-accent);
        border-left-color: var(--theme-accent);
    }

    /* ============================================================
       主区域
       ============================================================ */
    .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .main-content { flex: 1; padding: 28px; overflow-y: auto; }

    .card {
        background: var(--theme-card);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--theme-border);
        border-radius: var(--ui-radius-card, 14px);
        padding: 22px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        display: none;
    }
    .card.active { display: block; }

    .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        flex-wrap: wrap;
        gap: 12px;
    }
    .card-head h2 {
        font-size: 1.15em;
        font-weight: 500;
        color: var(--theme-accent);
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .card-head .badge {
        background: var(--theme-accent-soft);
        border: 1px solid var(--theme-accent-border);
        color: var(--theme-accent);
        font-size: 0.85em;
        padding: 3px 10px;
        border-radius: 20px;
    }

    /* ============================================================
       欢迎卡片
       ============================================================ */
    .welcome-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 60px 30px;
        gap: 20px;
    }
    .welcome-avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 3px solid var(--theme-accent);
        background: var(--theme-hover);
        object-fit: cover;
        box-shadow: 0 4px 30px var(--theme-accent-soft);
    }
    .welcome-title {
        font-size: 1.6em;
        font-weight: 600;
        color: var(--theme-accent);
        letter-spacing: 1px;
    }
    .welcome-email {
        font-size: 1em;
        color: var(--theme-text-dim);
        word-break: break-all;
    }
    .welcome-hint {
        font-size: 0.93em;
        color: var(--theme-text-faint);
        line-height: 1.8;
        margin-top: 10px;
        max-width: 420px;
    }

    /* ============================================================
       信息卡片
       ============================================================ */
    .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
        margin-top: 6px;
    }
    .info-box {
        background: var(--theme-info-box);
        border: 1px solid var(--theme-border);
        border-radius: var(--ui-radius-inner, 12px);
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .info-box .label {
        font-size: 0.85em;
        color: var(--theme-text-dim);
        letter-spacing: 0.5px;
    }
    .info-box .value {
        font-size: 1.15em;
        font-weight: 500;
        color: var(--theme-text);
        word-break: break-all;
    }

    /* ============================================================
       外观设置区
       ============================================================ */
    .theme-section-hint {
        font-size: 0.93em;
        color: var(--theme-text-dim);
        line-height: 1.7;
        margin-bottom: 20px;
    }

    /* ============================================================
       响应式
       ============================================================ */
    @media (max-width: 768px) {
        body { flex-direction: column; }
        .sidebar {
            width: 100%;
            padding: 15px 0 0;
            border-right: none;
            border-bottom: 1px solid var(--theme-border);
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }
        .user-profile {
            flex-direction: row;
            padding: 0 15px;
            border-bottom: none;
            margin-bottom: 0;
            gap: 10px;
            flex: 1;
        }
        .avatar-wrapper { width: 40px; height: 40px; }
        .avatar-edit { width: 16px; height: 16px; font-size: 9px; }
        .user-details .role { display: none; }
        .nav-menu {
            display: flex;
            order: 3;
            width: 100%;
            overflow-x: auto;
            margin-top: 10px;
        }
        .nav-item {
            padding: 10px 15px;
            white-space: nowrap;
            border-left: none;
            border-bottom: 3px solid transparent;
        }
        .nav-item.active { border-left: none; border-bottom-color: var(--theme-accent); }
        .main-content { padding: 16px; }
        .card { padding: 16px; }
        .welcome-card { padding: 40px 20px; }
        .welcome-avatar { width: 90px; height: 90px; }

        .theme-switcher { padding: 14px 16px; gap: 10px; }
        .theme-dot { width: 30px; height: 30px; }
        .setting-options { gap: 8px; }
        .setting-btn { padding: 10px 12px; font-size: 0.93em; }
    }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="user-profile">
            <div class="avatar-wrapper">
                <img id="avatarImg" src="image/default-avatar.png" alt="头像">
                <label for="avatarInput" class="avatar-edit" title="更换头像">📷</label>
                <input type="file" id="avatarInput" accept="image/*" style="display:none;">
            </div>
            <div class="user-details">
                <span class="email" id="userEmail">加载中...</span>
                <div class="user-bottom-row">
                    <span class="role">普通用户</span>
                    <button class="logout-btn-mini" id="logoutBtn">退出</button>
                </div>
            </div>
        </div>

        <nav class="nav-menu">
            <div class="nav-item active" data-tab="home" onclick="switchTab('home')">🏠 我的主页</div>
            <div class="nav-item" data-tab="profile" onclick="switchTab('profile')">👤 我的资料</div>
            <div class="nav-item" data-tab="theme" onclick="switchTab('theme')">🎨 外观设置</div>
        </nav>
    </aside>

    <div class="main-wrapper">
        <main class="main-content">

            <div class="card active" id="cardHome">
                <div class="welcome-card">
                    <img id="welcomeAvatar" class="welcome-avatar"
                         src="image/default-avatar.png" alt="头像">
                    <div class="welcome-title" id="welcomeTitle">欢迎回来</div>
                    <div class="welcome-email" id="welcomeEmail">—</div>
                    <div class="welcome-hint">
                        这里是你的个人主页<br>
                        当前登录端并不接入主服务器所以为空
                    </div>
                </div>
            </div>

            <div class="card" id="cardProfile">
                <div class="card-head">
                    <h2>👤 我的资料</h2>
                    <span class="badge">仅自己可见</span>
                </div>
                <div class="info-grid">
                    <div class="info-box">
                        <span class="label">邮箱</span>
                        <span class="value" id="infoEmail">—</span>
                    </div>
                    <div class="info-box">
                        <span class="label">昵称</span>
                        <span class="value" id="infoName">—</span>
                    </div>
                    <div class="info-box">
                        <span class="label">手机号</span>
                        <span class="value" id="infoPhone">—</span>
                    </div>
                    <div class="info-box">
                        <span class="label">注册时间</span>
                        <span class="value" id="infoCreated">—</span>
                    </div>
                </div>
            </div>

            <!-- ⭐ 外观设置 -->
            <div class="card" id="cardTheme">
                <div class="card-head">
                    <h2>🎨 外观设置</h2>
                    <span class="badge">跟账号同步</span>
                </div>

                <div class="theme-section-hint">
                    所有设置都会保存到你的账号，换设备登录时自动同步。
                </div>

                <!-- 主题配色 -->
                <div class="setting-group">
                    <div class="setting-label">
                        <span class="setting-title">主题配色</span>
                        <span class="setting-desc">选择你喜欢的界面主色调</span>
                    </div>
                    <div id="themeSwitcherContainer"></div>
                </div>

                <!-- 字号大小 -->
                <div class="setting-group">
                    <div class="setting-label">
                        <span class="setting-title">字号大小</span>
                        <span class="setting-desc">调整界面文字和间距的大小</span>
                    </div>
                    <div class="setting-options" data-setting="fontSize">
                        <button class="setting-btn" data-value="small">小</button>
                        <button class="setting-btn" data-value="medium">标准</button>
                        <button class="setting-btn" data-value="large">大</button>
                    </div>
                </div>

                <!-- 圆角风格 -->
                <div class="setting-group">
                    <div class="setting-label">
                        <span class="setting-title">圆角风格</span>
                        <span class="setting-desc">调整卡片、输入框和按钮的圆润程度</span>
                    </div>
                    <div class="setting-options" data-setting="radius">
                        <button class="setting-btn" data-value="small">直角</button>
                        <button class="setting-btn" data-value="medium">标准</button>
                        <button class="setting-btn" data-value="large">圆润</button>
                    </div>
                </div>

                <!-- 过渡动效 -->
                <div class="setting-group">
                    <div class="setting-label">
                        <span class="setting-title">过渡动效</span>
                        <span class="setting-desc">关闭后切换页面和主题时不再有动画</span>
                    </div>
                    <div class="setting-options" data-setting="animations">
                        <button class="setting-btn" data-value="on">开启</button>
                        <button class="setting-btn" data-value="off">关闭</button>
                    </div>
                </div>

                <!-- 重置按钮 -->
                <div class="setting-reset-row">
                    <button class="setting-reset-btn" id="resetAppearanceBtn">
                        ↺ 恢复默认设置
                    </button>
                </div>
            </div>

        </main>
    </div>

<script>
var SUPABASE_URL = 'https://syxawclhvreyxltynpnj.supabase.co';
var SUPABASE_KEY = 'sb_publishable_EvEBa8dU22MpK6E7UsnWbQ_2JRdVeZQ';
var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var userEmailEl    = document.getElementById('userEmail');
var logoutBtn      = document.getElementById('logoutBtn');
var avatarInput    = document.getElementById('avatarInput');
var avatarImg      = document.getElementById('avatarImg');
var welcomeAvatar  = document.getElementById('welcomeAvatar');
var welcomeTitle   = document.getElementById('welcomeTitle');
var welcomeEmail   = document.getElementById('welcomeEmail');

var infoEmail      = document.getElementById('infoEmail');
var infoName       = document.getElementById('infoName');
var infoPhone      = document.getElementById('infoPhone');
var infoCreated    = document.getElementById('infoCreated');

var DEFAULT_AVATAR = 'image/default-avatar.png';
var currentUser = null;

function switchTab(tab) {
    document.querySelectorAll('.nav-item').forEach(function (el) {
        el.classList.toggle('active', el.getAttribute('data-tab') === tab);
    });
    document.getElementById('cardHome').classList.toggle('active', tab === 'home');
    document.getElementById('cardProfile').classList.toggle('active', tab === 'profile');
    document.getElementById('cardTheme').classList.toggle('active', tab === 'theme');
}

/* ============================================================
 * 头像上传
 * ============================================================ */
avatarInput.addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;

    var lastUpload = localStorage.getItem('last_avatar_upload');
    if (lastUpload) {
        var elapsed = Date.now() - parseInt(lastUpload, 10);
        var oneHour = 60 * 60 * 1000;
        if (elapsed < oneHour) {
            var remainingMin = Math.ceil((oneHour - elapsed) / 60000);
            var msg = remainingMin >= 60
                ? Math.floor(remainingMin / 60) + ' 小时 ' + (remainingMin % 60) + ' 分钟'
                : remainingMin + ' 分钟';
            alert('头像修改过于频繁\n请 ' + msg + ' 后再试');
            this.value = '';
            return;
        }
    }

    if (file.size > 5 * 1024 * 1024) {
        alert('头像文件大小不能超过 5 MB！');
        this.value = '';
        return;
    }
    if (!file.type.startsWith('image/')) {
        alert('请上传图片文件！');
        this.value = '';
        return;
    }

    supabaseClient.auth.getUser().then(function (userRes) {
        if (userRes.error || !userRes.data.user) {
            alert('获取用户信息失败，请重新登录');
            return;
        }
        var user = userRes.data.user;
        var userId = user.id;
        var fileExt = file.name.split('.').pop();
        var filePath = userId + '/' + Date.now() + '.' + fileExt;

        supabaseClient.storage
            .from('avatars')
            .upload(filePath, file, { upsert: true })
            .then(function (uploadRes) {
                if (uploadRes.error) {
                    alert('头像上传失败：' + uploadRes.error.message);
                    return;
                }
                return supabaseClient.storage
                    .from('avatars')
                    .createSignedUrl(filePath, 60 * 60 * 24 * 365);
            })
            .then(function (signRes) {
                if (!signRes || signRes.error) {
                    if (signRes) alert('生成头像链接失败：' + signRes.error.message);
                    return;
                }
                var signedUrl = signRes.data.signedUrl;

                return supabaseClient.auth.updateUser({
                    data: { avatar_url: signedUrl }
                }).then(function (updateRes) {
                    if (updateRes.error) {
                        alert('头像保存失败：' + updateRes.error.message);
                        return;
                    }
                    return supabaseClient
                        .from('profiles')
                        .update({ avatar_url: signedUrl })
                        .eq('id', userId);
                }).then(function (profileRes) {
                    if (profileRes && profileRes.error) {
                        console.warn('profiles 头像同步失败：', profileRes.error.message);
                    }
                    localStorage.setItem('last_avatar_upload', Date.now().toString());
                    avatarImg.src = signedUrl;
                    welcomeAvatar.src = signedUrl;
                    alert('头像更新成功！\n下次修改需等待 1 小时');
                });
            });
    });
});

/* 退出登录 */
logoutBtn.addEventListener('click', function () {
    supabaseClient.auth.signOut().then(function () {
        location.href = 'index.html';
    });
});

/* ============================================================
 * 权限守卫
 * ============================================================ */
supabaseClient.auth.getSession().then(function (res) {
    var session = res.data && res.data.session;

    if (!session) {
        location.href = 'index.html';
        return;
    }

    currentUser = session.user;
    var role = currentUser.app_metadata && currentUser.app_metadata.role;

    if (role === 'admin') {
        location.href = 'admin-dashboard.html';
        return;
    }

    userEmailEl.textContent = currentUser.email || '未知邮箱';
    welcomeEmail.textContent = currentUser.email || '未知邮箱';

    var avatarUrl = (currentUser.user_metadata && currentUser.user_metadata.avatar_url)
        ? currentUser.user_metadata.avatar_url
        : DEFAULT_AVATAR;

    avatarImg.src = avatarUrl;
    welcomeAvatar.src = avatarUrl;

    supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .maybeSingle()
        .then(function (profileRes) {
            var profile = profileRes.data || {};

            welcomeTitle.textContent = profile.full_name
                ? '欢迎回来，' + profile.full_name
                : '欢迎回来';

            infoEmail.textContent = currentUser.email || '—';
            infoName.textContent  = profile.full_name || '未设置';
            infoPhone.textContent = profile.phone || '未设置';
            infoCreated.textContent = profile.created_at
                ? new Date(profile.created_at).toLocaleString('zh-CN', { hour12: false })
                : '—';
        });
});
</script>

<script src="other/theme.js"></script>

</body>
</html>
